services:
  db:
    image: postgres:16
    container_name: urechki_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: urechki_main
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - urechki_network

  redis:
    image: redis:alpine
    container_name: urechki_redis
    ports:
      - "6379:6379"
    networks:
      - urechki_network

  catalog-service:
    build: ./catalog-service
    container_name: catalog_service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/urechki_main
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      - db
      - redis
    networks:
      - urechki_network

  crm-service:
    build: ./crm-service
    container_name: crm_service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/urechki_main
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      - db
    networks:
      - urechki_network

  order-service:
    build: ./order-service
    container_name: order_service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/urechki_main
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      - db
      - payment-service
    networks:
      - urechki_network

  notification-service:
    build: ./notification-service
    container_name: notification_service
    ports:
      - "8084:8084"
    depends_on:
      - order-service
    networks:
      - urechki_network

  # НОВЫЙ СЕРВИС ОПЛАТЫ
  payment-service:
    build: ./payment-service
    container_name: payment_service
    ports:
      - "8085:8085"
    networks:
      - urechki_network

  frontend:
    build: ./frontend
    container_name: urechki_frontend
    ports:
      - "80:80"
    depends_on:
      - catalog-service
      - crm-service
      - order-service
    networks:
      - urechki_network

volumes:
  db_data:

networks:
  urechki_network:
    driver: bridge