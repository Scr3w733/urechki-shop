services:
  db:
    image: postgres:16
    container_name: urechki_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: urechki_main
      PGCLIENTENCODING: UTF8
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/00-schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
      - ./products.sql:/docker-entrypoint-initdb.d/01-products.sql:ro
    networks:
      - urechki_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d urechki_main"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:alpine
    container_name: urechki_redis
    ports:
      - "6379:6379"
    networks:
      - urechki_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  catalog-service:
    build: ./catalog-service
    container_name: catalog_service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/urechki_main
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - urechki_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/products || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  crm-service:
    build: ./crm-service
    container_name: crm_service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/urechki_main
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      APP_ADMIN_EMAIL: admin@urechki.ru
    depends_on:
      db:
        condition: service_healthy
    networks:
      - urechki_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/api/customers || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  payment-service:
    build: ./payment-service
    container_name: payment_service
    ports:
      - "8085:8085"
    networks:
      - urechki_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8085/api/payments/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  order-service:
    build: ./order-service
    container_name: order_service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/urechki_main
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      APP_SERVICES_CATALOG: http://catalog-service:8080
      APP_SERVICES_CRM: http://crm-service:8081
      APP_SERVICES_PAYMENT: http://payment-service:8085
      APP_SERVICES_NOTIFICATION: http://notification-service:8084
    depends_on:
      db:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      crm-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    networks:
      - urechki_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8082/api/orders || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  notification-service:
    build: ./notification-service
    container_name: notification_service
    ports:
      - "8084:8084"
    depends_on:
      order-service:
        condition: service_healthy
    networks:
      - urechki_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8084/api/notifications/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  loyalty-service:
    build: ./loyalty-service
    container_name: loyalty_service
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/urechki_main
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - urechki_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8086/api/loyalty/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  tracking-service:
    build: ./tracking-service
    container_name: tracking_service
    ports:
      - "8087:8087"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/urechki_main
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - urechki_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8087/api/tracking/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  favorites-service:
    build: ./favorites-service
    container_name: favorites_service
    ports:
      - "8088:8088"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/urechki_main
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - urechki_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8088/api/favorites/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  analytics-service:
    build: ./analytics-service
    container_name: analytics_service
    ports:
      - "8089:8089"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/urechki_main
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - urechki_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8089/api/analytics/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  mobile-gateway-service:
    build: ./mobile-gateway-service
    container_name: mobile_gateway_service
    ports:
      - "8090:8090"
    environment:
      APP_SERVICES_CATALOG: http://catalog-service:8080
      APP_SERVICES_CRM: http://crm-service:8081
      APP_SERVICES_ORDERS: http://order-service:8082
      APP_SERVICES_LOYALTY: http://loyalty-service:8086
      APP_SERVICES_TRACKING: http://tracking-service:8087
      APP_SERVICES_FAVORITES: http://favorites-service:8088
      APP_SERVICES_NOTIFICATIONS: http://notification-service:8084
      APP_SERVICES_ANALYTICS: http://analytics-service:8089
    depends_on:
      catalog-service:
        condition: service_healthy
      crm-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      loyalty-service:
        condition: service_healthy
      tracking-service:
        condition: service_healthy
      favorites-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
    networks:
      - urechki_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8090/api/mobile/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  frontend:
    build: ./frontend
    container_name: urechki_frontend
    ports:
      - "80:80"
    depends_on:
      catalog-service:
        condition: service_healthy
      crm-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      loyalty-service:
        condition: service_healthy
      tracking-service:
        condition: service_healthy
      favorites-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
      mobile-gateway-service:
        condition: service_healthy
    networks:
      - urechki_network

volumes:
  db_data:

networks:
  urechki_network:
    driver: bridge
