services:
  db:
    image: postgres:16
    container_name: urechki_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: urechki_main
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/00-schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
      - ./products.sql:/docker-entrypoint-initdb.d/01-products.sql:ro
    networks:
      - urechki_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d urechki_main"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:alpine
    container_name: urechki_redis
    ports:
      - "6379:6379"
    networks:
      - urechki_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  catalog-service:
    build: ./catalog-service
    container_name: catalog_service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/urechki_main
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - urechki_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/products || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  crm-service:
    build: ./crm-service
    container_name: crm_service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/urechki_main
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - urechki_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/api/customers || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  payment-service:
    build: ./payment-service
    container_name: payment_service
    ports:
      - "8085:8085"
    networks:
      - urechki_network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8085"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  order-service:
    build: ./order-service
    container_name: order_service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/urechki_main
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      db:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      crm-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    networks:
      - urechki_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8082/api/orders || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  notification-service:
    build: ./notification-service
    container_name: notification_service
    ports:
      - "8084:8084"
    depends_on:
      order-service:
        condition: service_healthy
    networks:
      - urechki_network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8084"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  frontend:
    build: ./frontend
    container_name: urechki_frontend
    ports:
      - "80:80"
    depends_on:
      catalog-service:
        condition: service_healthy
      crm-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    networks:
      - urechki_network

volumes:
  db_data:

networks:
  urechki_network:
    driver: bridge
